# WirePlumber ALSA monitor configuration for Chromebooks (Google Brya / Omnigul)
# Hardware:
#   - Speaker Amp: Realtek RT1019 (via SOF topology sof-rpl-rt1019-rt5682.tplg / sof-adl-rt1019-rt5682.tplg)
#   - Headset Codec: Realtek RT5682S
#   - Internal Mic (Mic2): Dual/Quad digital microphone array (DMIC)
#   - Headset Mic (Mic1): 3.5mm TRRS analog headset jack microphone
#
# Mic2 is given higher priority (2000) so the internal microphone is used by default.
# Mic1 is given lower priority (500) to prevent an empty 3.5mm jack from capturing silence.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*Mic2.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.*Mic1.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 500
      }
    }
  }
]
